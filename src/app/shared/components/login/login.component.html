<div class="flex min-h-screen w-full font-sans antialiased">
  <div class="relative hidden w-1/2 bg-gray-900 lg:flex flex-col justify-between p-12 overflow-hidden">
    <img src="/assets/img/voiture.jpg" alt="Véhicule d'exception"
      class="absolute inset-0 h-full w-full object-cover opacity-80" />

    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20"></div>

    <div></div>

    <div class="relative z-10 max-w-lg text-white space-y-4">
      <h1 class="text-4xl font-bold tracking-tight sm:text-5xl leading-tight">
        L'excellence en mouvement.
      </h1>
      <p class="text-base text-gray-200 font-normal">
        Assurez votre tranquillité d'esprit avec des solutions sur-mesure pour votre véhicule d'exception.
      </p>
    </div>
  </div>

  <div class="flex flex-1 flex-col justify-between bg-white px-6 py-8 sm:px-12 lg:px-16">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="flex h-12 w-12 items-center justify-center">
          <img src="assets/img/ASS-LOGO.png" alt="">
        </div>

      </div>

      <a href="#" class="flex items-center text-sm text-gray-600 hover:text-gray-900">
        <svg class="mr-1.5 h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Aide
      </a>
    </div>

    <div class="mx-auto w-full max-w-sm space-y-6">
      <div class="space-y-2">
        <h2 class="text-3xl font-bold tracking-tight text-gray-900">Se connecter</h2>
        <p class="text-sm text-gray-500">Accédez à votre espace</p>
      </div>

      <!-- Message d'erreur global -->
      <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
        <p class="text-sm text-red-700">{{ errorMessage }}</p>
      </div>

      <!-- ÉTAPE 1 : CONNEXION -->
      <form (ngSubmit)="onLoginSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adresse e-mail</label>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="votre@email.com"
              class="w-full rounded-md border-0 bg-gray-100 py-3 pl-10 pr-4 text-sm text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-red-600 focus:outline-none" required />
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
            <a href="#" class="text-sm text-red-600 hover:text-red-700 font-medium">Mot de passe oublié ?</a>
          </div>
          <div class="relative">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
              <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••"
              class="w-full rounded-md border-0 bg-gray-100 py-3 pl-10 pr-10 text-sm text-gray-900 placeholder-gray-400 focus:bg-white focus:ring-2 focus:ring-red-600 focus:outline-none" required />
            <button type="button" class="absolute inset-y-0 right-0 flex items-center pr-3">
              <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center pt-2">
          <input id="remember-me" type="checkbox"
            class="h-4 w-4 rounded border-gray-300 text-red-600 focus:ring-red-600" />
          <label for="remember-me" class="ml-2 block text-sm text-gray-600">Se souvenir de moi</label>
        </div>

        <button type="submit"
          class="flex w-full items-center justify-center rounded-md bg-red-700 py-3 px-4 text-sm font-medium text-white shadow hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-600 focus:ring-offset-2 transition-colors mt-4">
          <span>Se connecter</span>
          <svg class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </form>

    </div>

    <div class="flex items-center justify-between text-xs text-gray-500 pt-6">
      <span>© 2024 ASS-Assurance</span>
      <div class="flex space-x-4">
        <a href="#" class="hover:underline">Confidentialité</a>
        <a href="#" class="hover:underline">Mentions légales</a>
      </div>
    </div>
  </div>
</div>
